name: Design System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: design-system-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: 20455
      BASE_PATH: /rz-builder-design-system/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify retired platform references are absent
        shell: bash
        run: |
          platform_pattern="$(printf '%s%s' 'rep' 'lit')"
          if git grep -ni "$platform_pattern" -- . || git ls-files | grep -ni "$platform_pattern"; then
            echo "::error::Retired platform references remain in tracked files."
            exit 1
          fi
          env_pattern="$(printf '%s%s' 'REPL' '_ID')"
          if git grep -ni "$env_pattern" -- . || git ls-files | grep -ni "$env_pattern"; then
            echo "::error::Retired platform environment references remain in tracked files."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check design token contrast
        run: pnpm --filter @workspace/rz-builder-design-system run test:tokens

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build
